<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Page not found | Ve Bui</title>
  <link rel="icon" type="image/svg+xml" href="/solid-website/favicon.svg" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0b1220;
      color: #e5e7eb;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main { max-width: 32rem; text-align: center; }
    .code {
      margin: 0 0 8px;
      font-family: "JetBrains Mono", ui-monospace, Consolas, monospace;
      font-size: 14px;
      letter-spacing: 0.08em;
      color: #22d3ee;
    }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 8vw, 3rem); line-height: 1.1; }
    p { margin: 0 0 28px; color: #cbd5e1; }
    a.home {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 8px;
      background: #22d3ee;
      color: #0b1220;
      font-weight: 700;
      text-decoration: none;
    }
    a.home:hover { background: #67e8f9; }
    a.home:focus-visible { outline: 3px solid #e5e7eb; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>That link doesn't lead anywhere. It may be mistyped or out of date.</p>
    <a class="home" href="/solid-website/">Back to the home page</a>
